services:
  app:
    build: .
    container_name: rush_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/rush
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: rush_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - rush_data:/data/db

volumes:
  rush_data:
